<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Backoffice de catálogo — Admin</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <link rel="stylesheet" href="../src/admin.css" />
</head>
<body>
  <div class="admin-page">
    <header class="admin-header">
      <h1>Backoffice de catálogo</h1>
      <div class="admin-usage" id="usage-banner">Cargando uso de la API…</div>
    </header>

    <section class="admin-panel">
      <h2>Productos</h2>
      <div class="field">
        <label for="product-search-input">Buscar producto</label>
        <div class="product-search-row">
          <input id="product-search-input" type="text" placeholder="Nombre, SKU, código de barras o marca…" autocomplete="off" />
          <select id="product-category-filter">
            <option value="">Todas las categorías</option>
          </select>
          <select id="product-image-filter">
            <option value="">Con o sin imagen</option>
            <option value="false">Sin imagen</option>
            <option value="true">Con imagen</option>
          </select>
        </div>
      </div>
      <div class="product-results-row">
        <p id="product-results-count" class="admin-hint"></p>
        <select id="product-sort">
          <option value="">Orden: relevancia</option>
          <option value="ventas_desc">Más vendidos</option>
          <option value="clientes_desc">Más solicitados</option>
          <option value="disponible_primero">Disponibles primero</option>
          <option value="a_consultar_primero">A consultar primero</option>
          <option value="sin_stock_primero">Sin stock primero</option>
          <option value="sin_imagen_primero">Sin imagen primero</option>
          <option value="nombre_asc">Nombre A-Z</option>
          <option value="nombre_desc">Nombre Z-A</option>
        </select>
      </div>
      <div id="product-search-results" class="product-list-grid"></div>
      <div id="selected-product-card" class="selected-product-card" hidden></div>
    </section>

    <section class="admin-panel" id="history-section" hidden>
      <h2>Historial de imágenes de este producto</h2>
      <div id="history-grid" class="history-grid"></div>
    </section>

    <section class="admin-panel" id="pending-section" hidden>
      <h2>Pendientes de revisión (<span id="pending-count">0</span>)</h2>
      <p class="admin-hint">Los medicamentos no tienen casillero de selección — requieren revisión individual (confirmación obligatoria de laboratorio/concentración/presentación).</p>
      <div class="pending-bulk-actions">
        <button class="btn btn--secondary" id="pending-select-all">Seleccionar todas (no medicamentos)</button>
        <button class="btn btn--secondary" id="pending-select-none">Deseleccionar todas</button>
        <button class="btn btn--success" id="pending-approve-selected" disabled>Aprobar seleccionadas (<span id="pending-selected-count">0</span>)</button>
      </div>
      <div id="pending-grid" class="history-grid"></div>
    </section>
  </div>

  <div id="review-overlay" class="review-overlay" hidden>
    <div class="review-modal" id="review-modal"></div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="../src/admin.js"></script>
</body>
</html>
